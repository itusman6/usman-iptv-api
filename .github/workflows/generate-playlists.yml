
name: Generate M3U Playlists

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'sources/**'
      - 'requirements.txt'
      - '.github/workflows/generate-playlists.yml'

permissions:
  contents: write

concurrency:
  group: generate-m3u-playlists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Print trigger diagnostics
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "UTC time: $(date -u)"
          echo "Repository: ${{ github.repository }}"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate converge playlist
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            rm -f converge.m3u

            if python scripts/make_playlist.py &&
               [ -s converge.m3u ]; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Playlist generation failed"
              exit 1
            fi

            sleep 10
          done

          count=$(grep -c '^#EXTINF' converge.m3u || true)
          echo "Channels: $count"

          if [ "$count" -lt 10 ]; then
            echo "::error::Fewer than 10 channels generated"
            exit 1
          fi

          mkdir -p playlists
          mv converge.m3u playlists/converge.m3u

      - name: Copy source playlists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p playlists sources

          count=0

          for f in sources/*.m3u; do
            name=$(basename "$f")

            python - "$f" "playlists/$name" <<'PY'
          import sys
          from pathlib import Path
          from datetime import datetime, timezone

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])

          raw = src.read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()

          now = datetime.now(timezone.utc).strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )

          output = ["#EXTM3U", f"# updated: {now}"]

          for line in raw:
              s = line.strip()

              if s.startswith("#EXTM3U"):
                  continue
              if s.startswith("# generated:"):
                  continue
              if s.startswith("# updated:"):
                  continue

              output.append(line.rstrip())

          while output and not output[-1]:
              output.pop()

          dst.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print(f"Created {dst}")
          PY

            count=$((count + 1))
          done

          echo "Source playlists processed: $count"

      - name: Rebuild index playlist
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          directory = Path("playlists")
          files = sorted(
              p for p in directory.glob("*.m3u")
              if p.name != "index.m3u"
          )

          now = datetime.now(timezone.utc).strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )

          lines = ["#EXTM3U", f"# generated: {now}"]

          for f in files:
              content = f.read_text(
                  encoding="utf-8", errors="replace"
              ).splitlines()

              count = sum(
                  line.startswith("#EXTINF")
                  for line in content
              )

              name = f.stem

              lines.append(
                  f'#EXTINF:-1 tvg-id="{name}" '
                  f'tvg-name="{name}" '
                  f'tvg-logo="https://i.imgur.com/c7CDrvS.png" '
                  f'group-title="Playlists",{name} [{count} ch]'
              )
              lines.append(f"./{f.name}")

          (directory / "index.m3u").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(f"Index generated with {len(files)} playlists")
          PY

      - name: Validate playlists
        shell: bash
        run: |
          set -euo pipefail

          test -s playlists/converge.m3u
          test -s playlists/index.m3u

          echo "=== Files ==="
          ls -lh playlists/

          echo "=== Channel counts ==="
          for f in playlists/*.m3u; do
            count=$(grep -c '^#EXTINF' "$f" || true)
            echo "$(basename "$f"): $count channels"
          done

      - name: Commit and push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A playlists/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m \
            "chore(playlists): update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase failed; check for conflicting changes"
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Playlists pushed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed."

            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          echo "::error::All push attempts failed."
          exit 1
