name: Generate-M3U-Playlists

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'sources/**'
      - 'requirements.txt'
      - '.github/workflows/generate-playlists.yml'

permissions:
  contents: write

concurrency:
  group: generate-playlists
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-24.04          # pinned (matches example) — no apt drift
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # NOTE: no custom token — default GITHUB_TOKEN is fine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'             # requires requirements.txt to exist

      - name: Verify repo layout
        run: |
          test -f requirements.txt || { echo "::error::requirements.txt missing"; exit 1; }
          test -f scripts/make_playlist.py || { echo "::error::scripts/make_playlist.py missing"; exit 1; }
          mkdir -p sources playlists
          ls -la scripts/ sources/ 2>/dev/null || true

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # 1) Regenerate converge.m3u
      # ---------------------------------------------------------
      - name: Generate converge.m3u
        id: gen
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/make_playlist.py

      - name: Validate converge.m3u
        if: always()
        run: |
          if [ ! -f converge.m3u ]; then
            echo "::error::make_playlist.py did not produce converge.m3u"
            exit 1
          fi
          n=$(grep -c '^#EXTINF' converge.m3u || echo 0)
          echo "converge.m3u channels: $n"
          if [ "$n" -lt 10 ]; then
            echo "::error::converge.m3u has too few channels ($n)"
            exit 1
          fi
          mv -f converge.m3u playlists/converge.m3u

      # ---------------------------------------------------------
      # 2) Copy sources/*.m3u -> playlists/ WITH fresh timestamp
      # ---------------------------------------------------------
      - name: Copy sources -> playlists
        run: |
          shopt -s nullglob
          count=0
          for f in sources/*.m3u; do
            name=$(basename "$f")
            python - "$f" "playlists/$name" <<'PY'
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          src, dst = Path(sys.argv[1]), Path(sys.argv[2])
          raw = src.read_text(encoding="utf-8", errors="replace").splitlines()

          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          out = ["#EXTM3U", f"# updated: {now}"]

          for ln in raw:
              s = ln.strip()
              if s.startswith("#EXTM3U"):
                  continue
              if s.startswith("# generated:") or s.startswith("# updated:"):
                  continue
              out.append(ln.rstrip())

          while out and out[-1] == "":
              out.pop()

          dst.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
            printf "  %-35s %5d channels\n" "$name" "$(grep -c '^#EXTINF' "$f" || echo 0)"
            count=$((count+1))
          done
          echo "Copied $count file(s)"
          if [ "$count" -eq 0 ]; then
            echo "::warning::no source .m3u files found in sources/"
          fi

      # ---------------------------------------------------------
      # 3) Rebuild index.m3u with fresh timestamp
      # ---------------------------------------------------------
      - name: Build index.m3u
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          d = Path("playlists")
          files = sorted(p for p in d.glob("*.m3u") if p.name != "index.m3u")
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          lines = ["#EXTM3U", f"# generated: {now}"]
          for f in files:
              n = sum(1 for l in f.read_text(encoding="utf-8").splitlines()
                      if l.startswith("#EXTINF"))
              lines.append(
                  f'#EXTINF:-1 tvg-id="{f.stem}" tvg-name="{f.stem}" '
                  f'tvg-logo="https://i.imgur.com/c7CDrvS.png" '
                  f'group-title="Playlists",{f.stem}  [{n} ch]'
              )
              lines.append(f'./{f.name}')

          (d / "index.m3u").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"index.m3u -> {len(files)} entries @ {now}")
          PY

      # ---------------------------------------------------------
      # 4) Show state
      # ---------------------------------------------------------
      - name: Show playlists
        if: always()
        run: |
          echo "=== playlists/ ==="
          ls -la playlists/ || true
          echo
          for f in playlists/*.m3u; do
            [ -e "$f" ] || continue
            n=$(grep -c '^#EXTINF' "$f" || true)
            printf "  %-35s %5d channels\n" "$(basename "$f")" "$n"
          done
          echo
          echo "=== git status --short ==="
          git status --short

      # ---------------------------------------------------------
      # 5) Commit & push WITH RETRY (this was the biggest gap)
      # ---------------------------------------------------------
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A playlists/

          if git diff --cached --quiet; then
            echo "::warning::Nothing staged. Every file should have a fresh timestamp."
            exit 0
          fi

          echo "Staged changes:"
          git diff --cached --name-only

          git commit -m "chore(playlists): regenerate $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push attempt $i failed, rebasing and retrying..."
            git pull --rebase --autostash origin main || true
            sleep 5
          done

          echo "::error::Push failed after retries."
          exit 1

      # ---------------------------------------------------------
      # 6) Artifacts for debugging
      # ---------------------------------------------------------
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlists-${{ github.run_number }}
          path: |
            playlists/*.m3u
            checker.log
          if-no-files-found: warn
          retention-days: 14