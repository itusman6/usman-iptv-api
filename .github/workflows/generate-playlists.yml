name: Generate M3U Playlists

on:
  schedule:
    # Every 30 minutes. GitHub cron is UTC and best-effort (may be delayed).
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'sources/**'
      - '.github/workflows/generate-playlists.yml'
  # Allow manual re-trigger via API even when nothing changed
  repository_dispatch:
    types: [regenerate-playlists]

# Needed so the scheduled run can push commits
permissions:
  contents: write

concurrency:
  group: generate-playlists
  # Don't cancel an in-flight run mid-push; queue the next one instead.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "::warning::requirements.txt not found — installing fallback deps"
            pip install requests pycryptodome
          fi

      - name: Prepare dirs
        run: mkdir -p playlists

      # ---------------------------------------------------------
      # 1) Regenerate converge.m3u
      # ---------------------------------------------------------
      - name: Generate converge.m3u
        run: |
          set -euo pipefail
          python scripts/make_playlist.py
          if [ ! -f converge.m3u ]; then
            echo "::error::make_playlist.py did not produce converge.m3u"
            exit 1
          fi
          n=$(grep -c '^#EXTINF' converge.m3u || true)
          echo "converge.m3u channels: $n"
          if [ "$n" -lt 10 ]; then
            echo "::error::converge.m3u has too few channels ($n)"
            exit 1
          fi
          mv -f converge.m3u playlists/converge.m3u

      # ---------------------------------------------------------
      # 2) Copy sources/*.m3u -> playlists/ WITH fresh timestamp
      #    so every file has a real diff on every run.
      # ---------------------------------------------------------
      - name: Copy sources -> playlists
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for f in sources/*.m3u; do
            name=$(basename "$f")
            if [ "$name" = "index.m3u" ]; then
              echo "  skipping sources/index.m3u (reserved)"
              continue
            fi
            python scripts/refresh_playlist.py "$f" "playlists/$name"
            n=$(grep -c '^#EXTINF' "$f" || true)
            printf "  %-35s %5d channels\n" "$name" "$n"
            count=$((count+1))
          done
          echo "Copied $count file(s)"
          if [ "$count" -eq 0 ]; then
            echo "::warning::no source .m3u files found in sources/"
          fi

      # ---------------------------------------------------------
      # 3) Rebuild index.m3u with fresh timestamp
      # ---------------------------------------------------------
      - name: Build index.m3u
        run: |
          set -euo pipefail
          python scripts/build_index.py

      # ---------------------------------------------------------
      # 4) Show state
      # ---------------------------------------------------------
      - name: Show playlists
        run: |
          set -euo pipefail
          echo "=== playlists/ ==="
          ls -la playlists/
          echo
          for f in playlists/*.m3u; do
            [ -e "$f" ] || continue
            n=$(grep -c '^#EXTINF' "$f" || true)
            printf "  %-35s %5d channels\n" "$(basename "$f")" "$n"
          done
          echo
          echo "=== git status --short ==="
          git status --short

      # ---------------------------------------------------------
      # 5) Commit & push
      # ---------------------------------------------------------
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A playlists/

          if git diff --cached --quiet; then
            echo "::warning::Nothing staged."
            exit 0
          fi

          echo "Staged changes:"
          git diff --cached --name-only

          git commit -m "chore(playlists): regenerate $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
