
name: Generate M3U Playlists

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'sources/**'
      - 'requirements.txt'
      - '.github/workflows/generate-playlists.yml'

permissions:
  contents: write

concurrency:
  group: generate-m3u-playlists
  cancel-in-progress: false

jobs:
  build:
    name: Generate and publish M3U playlists
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Diagnostic information
      - name: Show run information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S')"

      # 2. Checkout latest main
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      # 3. Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Install dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt not found"
            exit 1
          fi

          for attempt in 1 2 3; do
            if python -m pip install --upgrade pip &&
               python -m pip install -r requirements.txt; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Dependency installation failed"
              exit 1
            fi

            echo "Installation attempt $attempt failed; retrying"
            sleep 10
          done

      # 5. Check required files and secrets
      - name: Validate configuration
        shell: bash
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STREAM_PASSPHRASE: ${{ secrets.STREAM_PASSPHRASE }}
        run: |
          set -euo pipefail

          test -f scripts/make_playlist.py || {
            echo "::error::scripts/make_playlist.py is missing"
            exit 1
          }

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_ANON_KEY repository secret"
            exit 1
          fi

          if [ -z "$STREAM_PASSPHRASE" ]; then
            echo "::error::Missing STREAM_PASSPHRASE repository secret"
            exit 1
          fi

          mkdir -p playlists sources
          echo "Configuration checks passed"

      # 6. Generate converge.m3u
      - name: Generate converge playlist
        shell: bash
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STREAM_PASSPHRASE: ${{ secrets.STREAM_PASSPHRASE }}
        run: |
          set -euo pipefail

          success=false

          for attempt in 1 2 3; do
            rm -f converge.m3u

            echo "Generation attempt $attempt of 3"

            if python -u scripts/make_playlist.py &&
               [ -s converge.m3u ]; then
              success=true
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Generation failed; retrying in 10 seconds"
              sleep 10
            fi
          done

          if [ "$success" != true ]; then
            echo "::error::Playlist generation failed after 3 attempts"
            exit 1
          fi

          channels=$(grep -c '^#EXTINF' converge.m3u || true)

          echo "Generated channels: $channels"

          if [ "$channels" -lt 10 ]; then
            echo "::error::Expected at least 10 channels"
            exit 1
          fi

          mv -f converge.m3u playlists/converge.m3u

      # 7. Copy sources/*.m3u
      - name: Copy source playlists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          count=0

          for f in sources/*.m3u; do
            name=$(basename "$f")

            python - "$f" "playlists/$name" <<'PY'
          import sys
          from pathlib import Path
          from datetime import datetime, timezone

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])

          raw = src.read_text(
              encoding="utf-8", errors="replace"
          ).splitlines()

          now = datetime.now(timezone.utc).strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )

          output = ["#EXTM3U", f"# updated: {now}"]

          for line in raw:
              stripped = line.strip()

              if stripped.startswith("#EXTM3U"):
                  continue
              if stripped.startswith("# generated:"):
                  continue
              if stripped.startswith("# updated:"):
                  continue

              output.append(line.rstrip())

          while output and not output[-1]:
              output.pop()

          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          print(f"Created {dst}")
          PY

            channels=$(grep -c '^#EXTINF' "playlists/$name" || true)
            echo "$name: $channels channels"

            count=$((count + 1))
          done

          echo "Source playlists processed: $count"

          if [ "$count" -eq 0 ]; then
            echo "::notice::No source M3U files found in sources/"
          fi

      # 8. Rebuild index.m3u
      - name: Build playlist index
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          directory = Path("playlists")

          files = sorted(
              p for p in directory.glob("*.m3u")
              if p.name != "index.m3u"
          )

          now = datetime.now(timezone.utc).strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )

          lines = ["#EXTM3U", f"# generated: {now}"]

          for f in files:
              content = f.read_text(
                  encoding="utf-8", errors="replace"
              ).splitlines()

              count = sum(
                  line.startswith("#EXTINF")
                  for line in content
              )

              name = f.stem

              lines.append(
                  f'#EXTINF:-1 tvg-id="{name}" '
                  f'tvg-name="{name}" '
                  f'tvg-logo="https://i.imgur.com/c7CDrvS.png" '
                  f'group-title="Playlists",{name} [{count} ch]'
              )

              lines.append(f"./{f.name}")

          index = directory / "index.m3u"
          index.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(f"Index entries: {len(files)}")
          print(f"Index file: {index}")
          print(f"Generated: {now}")
          PY

      # 9. Validate outputs
      - name: Validate generated playlists
        shell: bash
        run: |
          set -euo pipefail

          test -s playlists/converge.m3u
          test -s playlists/index.m3u

          channels=$(grep -c '^#EXTINF' playlists/converge.m3u || true)

          if [ "$channels" -lt 10 ]; then
            echo "::error::converge.m3u failed validation"
            exit 1
          fi

          echo "=== Generated files ==="
          ls -lh playlists/

          echo
          echo "=== Playlist channel counts ==="

          for f in playlists/*.m3u; do
            [ -f "$f" ] || continue
            count=$(grep -c '^#EXTINF' "$f" || true)
            printf '%-35s %s channels\n' \
              "$(basename "$f")" "$count"
          done

      # 10. Commit and push
      - name: Commit and push playlists
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A playlists/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m \
            "chore(playlists): regenerate $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase failed"
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Playlists successfully pushed to main"
              exit 0
            fi

            echo "Push attempt $attempt failed"

            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          echo "::error::Failed to push after 3 attempts"
          exit 1
